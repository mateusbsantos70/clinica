spring:
  application:
    name: clinic-essencia

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/essencia_viva?serverTimezone=America/Sao_Paulo&useSSL=false&allowPublicKeyRetrieval=true
    username: clinic_app
    password: "ClinicApp@123"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  # Primeiro administrador (só é criado se a tabela usuario estiver vazia).
  # Defina as variáveis de ambiente ADMIN_EMAIL e ADMIN_SENHA ao rodar.
  admin:
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}
  sessao:
    duracao-horas: 8
    inatividade-minutos: 30
  # Coloque true quando o site estiver em HTTPS
  cookie-seguro: false
